<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Todos os animais esperando por um lar no acervo da Pet Friends, em Capão da Canoa/RS.">
    <meta name="theme-color" content="#151F71">
    <title>Adoção | Pet Friends</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700;800&display=swap">

    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/tabletMedia.css">
    <link rel="stylesheet" href="src/css/laptopMedia.css">
    <link rel="stylesheet" href="src/css/largeDesktop.css">

    <script>document.documentElement.classList.add('js');</script>
</head>

<body class="innerPage">

    <header id="header" class="header">
        <div class="container headerInner">
            <a href="index.html" class="brand" aria-label="Pet Friends, voltar ao início">
                <img src="./assets/icons/favicon.png" alt=""> Pet Friends
            </a>

            <nav id="navMenu" class="nav" aria-label="Navegação principal">
                <a href="adocao.html" class="navLink">Adoção</a>
                <a href="anunciar.html" class="navLink">Anunciar</a>
                <a href="index.html#about" class="navLink">Como funciona</a>
                <a href="index.html#help" class="navLink">Ajudar</a>
                <div id="authSlot" class="authSlot"></div>
            </nav>

            <button id="menuButton" type="button" aria-label="Abrir menu" aria-expanded="false"
                aria-controls="navMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>

        <section class="pageHead">
            <div class="container">
                <span class="eyebrow">Adoção</span>
                <h1>Animais esperando por um lar</h1>
                <p>Converse com quem anunciou e combine uma adoção responsável.</p>
                <a href="anunciar.html" class="btn btnRed">Quero anunciar</a>
            </div>
        </section>

        <section class="section pageBody">
            <div class="container">
                <form id="filters" class="filters reveal">
                    <label>
                        Espécie
                        <select name="species">
                            <option value="">Todas</option>
                            <option value="cao">Cão</option>
                            <option value="gato">Gato</option>
                            <option value="outro">Outro</option>
                        </select>
                    </label>
                    <label>
                        Sexo
                        <select name="sex">
                            <option value="">Todos</option>
                            <option value="femea">Fêmea</option>
                            <option value="macho">Macho</option>
                        </select>
                    </label>
                    <label>
                        Porte
                        <select name="size">
                            <option value="">Todos</option>
                            <option value="pequeno">Pequeno</option>
                            <option value="medio">Médio</option>
                            <option value="grande">Grande</option>
                        </select>
                    </label>
                    <button type="reset" class="linkButton">Limpar filtros</button>
                </form>

                <ul id="adoptList" class="animalGrid"></ul>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footerDog">
            <img src="./assets/images/dog3.png" alt="">
        </div>

        <div class="container footerInner">
            <span class="brand reveal"><img src="./assets/icons/favicon.png" alt=""> Pet Friends</span>
            <p class="reveal">Adoção responsável em Capão da Canoa/RS</p>
            <a href="https://github.com/xJoaoPedro" target="_blank" rel="noopener noreferrer" class="reveal">
                Desenvolvido por @xJoaoPedro
            </a>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="./src/js/navigation.js"></script>
    <script src="./src/js/animations.js"></script>
    <script type="module" src="./src/js/headerAuth.js"></script>
    <script type="module" src="./src/js/adocao.js"></script>
</body>

</html>
