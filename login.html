<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na Pet Friends para falar com anunciantes e publicar anúncios de adoção.">
    <meta name="theme-color" content="#151F71">
    <title>Entrar | Pet Friends</title>

    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700;800&display=swap">

    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/tabletMedia.css">
    <link rel="stylesheet" href="src/css/laptopMedia.css">
    <link rel="stylesheet" href="src/css/largeDesktop.css">

    <script>document.documentElement.classList.add('js');</script>
</head>

<body class="innerPage">

    <header id="header" class="header">
        <div class="container headerInner">
            <a href="index.html" class="brand" aria-label="Pet Friends, voltar ao início">
                <img src="./assets/icons/favicon.png" alt=""> Pet Friends
            </a>

            <nav id="navMenu" class="nav" aria-label="Navegação principal">
                <a href="adocao.html" class="navLink">Adoção</a>
                <a href="anunciar.html" class="navLink">Anunciar</a>
                <a href="index.html#about" class="navLink">Como funciona</a>
                <a href="index.html#help" class="navLink">Ajudar</a>
                <div id="authSlot" class="authSlot"></div>
            </nav>

            <button id="menuButton" type="button" aria-label="Abrir menu" aria-expanded="false"
                aria-controls="navMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>

        <section class="authPage">
            <div class="authCard reveal">
                <img src="./assets/icons/favicon.png" alt="" class="authIcon">
                <h1>Entrar na Pet Friends</h1>
                <p class="authIntro">Com sua conta você fala com quem anunciou e publica seus próprios anúncios.</p>

                <div class="authTabs" role="tablist">
                    <button type="button" class="authTab" data-tab="login" role="tab" aria-selected="true">Entrar</button>
                    <button type="button" class="authTab" data-tab="signup" role="tab" aria-selected="false">Criar conta</button>
                </div>

                <button type="button" id="googleButton" class="googleButton">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3A12 12 0 1 1 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7A20 20 0 1 0 44 24c0-1.2-.1-2.4-.4-3.5Z" />
                        <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8A12 12 0 0 1 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7A20 20 0 0 0 6.3 14.7Z" />
                        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0 1 12.7 28l-6.5 5A20 20 0 0 0 24 44Z" />
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.4-.4-3.5Z" />
                    </svg>
                    Continuar com Google
                </button>

                <p class="authDivider"><span>ou com email</span></p>

                <form id="loginForm" class="authForm">
                    <label>Email <input type="email" name="email" autocomplete="email" required></label>
                    <label>Senha <input type="password" name="password" autocomplete="current-password" required></label>
                    <button type="button" id="forgotButton" class="linkButton">Esqueci minha senha</button>
                    <button type="submit" class="btn btnRed">Entrar</button>
                </form>

                <form id="signupForm" class="authForm" hidden>
                    <label>Nome <input type="text" name="name" autocomplete="name" maxlength="60" required></label>
                    <label>Email <input type="email" name="email" autocomplete="email" required></label>
                    <label>Senha <input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
                    <label>Confirme a senha <input type="password" name="confirm" autocomplete="new-password" minlength="6" required></label>
                    <button type="submit" class="btn btnRed">Criar conta</button>
                </form>

                <div id="authMessage" class="formMessage" role="status" hidden></div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footerDog">
            <img src="./assets/images/dog3.png" alt="">
        </div>

        <div class="container footerInner">
            <span class="brand reveal"><img src="./assets/icons/favicon.png" alt=""> Pet Friends</span>
            <p class="reveal">Adoção responsável em Capão da Canoa/RS</p>
            <a href="https://github.com/xJoaoPedro" target="_blank" rel="noopener noreferrer" class="reveal">
                Desenvolvido por @xJoaoPedro
            </a>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="./src/js/navigation.js"></script>
    <script src="./src/js/animations.js"></script>
    <script type="module" src="./src/js/headerAuth.js"></script>
    <script type="module" src="./src/js/login.js"></script>
</body>

</html>
